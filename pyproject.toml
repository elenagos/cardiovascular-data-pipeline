[project]
name = "cardiopulse"
version = "0.1.0"
description = "Cardiovascular real-time data pipeline and analytics platform"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "matplotlib",
    "plotly",
    "scikit-learn",
    "streamlit",
    "streamlit-autorefresh",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "target",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
